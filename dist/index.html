<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="game-build" content="13.8.0">
  <meta name="theme-color" content="#214b46">
  <meta name="description" content="30 天、9 回合的市議員選戰。點地圖上的地點出發，聽長輩、中年、青年三群人的訴求，和對手小馬搶同一批票，最後開票。">
  <title>2026 大安文山區議員選戰</title>
  <link rel="stylesheet" href="day.css?v=13.8.0">
  <link rel="stylesheet" href="ui-layout.css?v=13.8.1">
  <link rel="stylesheet" href="map-layout.css?v=13.8.1">
  <script>const campaignQuery=new URLSearchParams(location.search);window.COUNCILLOR_ROUNDS=campaignQuery.get("rounds")==="10"?10:9;</script>
  <script defer src="day-engine.js?v=13.8.0"></script>
  <script defer src="day-art.js?v=13.8.0"></script>
  <script defer src="day-team-art.js?v=13.8.0"></script>
  <script defer src="day-ui.js?v=13.8.0"></script>
</head>
<body class="v13">
  <a class="skip-link" href="#dock">跳到本回合的操作</a>
  <header class="masthead">
    <a class="wordmark" href="./" aria-label="2026 大安文山區議員選戰"><span class="wordmark-block" aria-hidden="true">2026</span><span>大安文山區議員選戰<small class="wordmark-sub">公館・木柵・景美・貓空</small></span></a>
    <section class="hud" aria-label="競選進度">
      <div class="hud-day"><strong id="day-label">第 1 回合<span>／ 9</span></strong><span id="day-dots" class="day-dots" aria-hidden="true"></span></div>
      <button class="hud-money" data-action="budget" aria-label="展開完整預算明細"><span class="eyebrow">競選款</span><strong id="cash">54 萬</strong></button>
      <button id="hud-race" class="hud-race" data-action="poll" aria-label="查看選情與民調"><span id="race-summary" class="race-summary">開始後估計</span></button>
    </section>
    <nav aria-label="遊戲工具"><details class="tools-menu"><summary>更多</summary><div class="tools-popover"><button id="art-switch" data-action="art-switch" aria-label="切換美術風格">霧面玩具</button><button data-action="journal">紀錄<span id="journal-count" class="count">0</span></button><button data-action="rules">規則</button><span id="global-controls"><button id="new-game" data-action="restart" class="new-game-button" title="回到選身分的畫面" hidden>新的一局</button></span></div></details></nav>
  </header>
  <main>
    <div id="save-warning" class="notice" role="status" hidden></div>
    <div class="game-layout">
      <section class="world-column" aria-label="競選小鎮與現場">
        <div class="world-heading"><div><span id="day-kicker" class="eyebrow">臺北市大安文山區</span><h1 id="world-title">從巷口，走進大家的日常。</h1></div><span class="location-chip" id="location-label">競選辦公室</span></div>
        <div id="world" class="world" role="group" aria-label="木柵小鎮。點地圖上的地點選這回合的行動；到了現場會看到圍觀的人群。">
          <div id="scene" class="scene" aria-hidden="true"></div>
          <div id="route-line" class="route-line" aria-hidden="true"></div>
          <div id="destination-marker" class="destination-marker" aria-hidden="true" hidden></div>
          <div id="rival" class="actor rival" aria-hidden="true"></div>
          <div id="team-actors" class="team-actors" aria-hidden="true"></div>
          <div id="player" class="actor player" aria-hidden="true"></div>
          <div id="action-effect" class="action-effect" aria-hidden="true"></div>
          <div id="new-teammate" class="actor new-teammate" aria-hidden="true" hidden></div>
          <div id="map-boards" class="map-boards" aria-hidden="true"></div>
          <div id="map-hotspots" class="map-hotspots"></div>
          <div id="venue-scene" class="venue-scene" aria-hidden="true" hidden></div>
          <div id="conversation-bubble" class="conversation-bubble" aria-hidden="true" hidden></div>
          <aside id="event-feedback" class="event-feedback" role="region" aria-label="選戰快報" aria-live="polite" hidden></aside>
          <div id="count-presentation" class="count-presentation" hidden><div id="count-scene" class="count-scene" aria-hidden="true"></div><div class="count-screen"><h2 id="count-stage" class="count-stage">投票結束，開票開始</h2><div class="count-board" aria-hidden="true"><b id="count-you-name">小沈</b><span class="count-track"><i id="count-meter"></i></span><strong id="count-votes">0</strong><i id="count-line" class="count-line"><span id="count-line-label">當選線</span></i></div></div><strong id="count-verdict" class="count-verdict" hidden></strong></div>
        </div>
        <nav id="mobile-destinations" class="mobile-destinations" aria-label="選擇目的地"></nav>
        <section id="event-timeline" class="event-timeline" aria-label="選戰事件時間線"></section>

      </section>
        <section id="dock" class="dock" tabindex="-1" aria-label="本回合的操作"><div id="dock-body" aria-live="polite"></div><span id="dock-tools" class="dock-tools"></span></section>
      <aside id="interaction" class="interaction" tabindex="-1" aria-label="局勢與結果"><div id="panel"></div></aside>
    </div>
    <section id="report" class="report" aria-label="成績單" hidden><div id="report-body"></div><div id="report-tools" class="report-tools"></div></section>
  </main>
  <footer><p>人物與事件皆為虛構。</p><p><a href="legacy-v12/index.html">v12 舊局 ↗</a></p></footer>
  <div id="dialog-overlay" class="dialog-overlay" hidden><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="dialog-top"><h2 id="dialog-title"></h2><button data-action="close" id="close-dialog" aria-label="關閉視窗">×</button></div><div id="dialog-body"></div><div id="dialog-tools"></div></section></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="notice">這個互動遊戲需要 JavaScript。開啟後重新載入即可開始。</p></noscript>
</body>
</html>
